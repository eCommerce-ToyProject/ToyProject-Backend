<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Live Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls input, .controls select, .controls button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 14px;
        }

        .controls button {
            background: #007bff;
            cursor: pointer;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #0056b3;
        }

        .controls button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-section {
            background: #333;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .video-section h3 {
            margin-bottom: 15px;
            color: #007bff;
        }

        video {
            width: 100%;
            max-width: 500px;
            height: 300px;
            background: #000;
            border-radius: 8px;
            object-fit: cover;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: #444;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
        }

        .viewer-list {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .viewer-item {
            padding: 5px 0;
            border-bottom: 1px solid #555;
        }

        .viewer-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .role-button {
            padding: 15px 30px;
            border: 2px solid #007bff;
            background: transparent;
            color: #007bff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-button.active {
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎥 WebRTC Live Streaming Demo</h1>
        <p>실시간 1:N 라이브 스트리밍</p>
    </div>

    <div class="role-selector">
        <button class="role-button" id="broadcasterBtn">📹 방송하기</button>
        <button class="role-button" id="viewerBtn">👀 시청하기</button>
    </div>

    <div class="controls">
        <input type="text" id="roomId" placeholder="방 ID 입력" value="room123">
        <input type="text" id="userId" placeholder="사용자 ID 입력" value="">
        <select id="videoQuality">
            <option value="720p">720p (HD)</option>
            <option value="480p">480p</option>
            <option value="360p">360p</option>
        </select>
        <button id="connectBtn">연결</button>
        <button id="disconnectBtn" disabled>연결 해제</button>
    </div>

    <div class="video-container">
        <div class="video-section">
            <h3>📹 내 화면</h3>
            <video id="localVideo" muted autoplay playsinline></video>
            <div style="margin-top: 10px;">
                <button id="toggleVideo">카메라 끄기</button>
                <button id="toggleAudio">마이크 끄기</button>
            </div>
        </div>

        <div class="video-section">
            <h3>📺 방송 화면</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div class="viewer-list">
        <h3>👥 시청자 목록</h3>
        <div id="viewersList">연결된 시청자가 없습니다.</div>
        
        <!-- 채팅 링크 추가 -->
        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #555;">
            <h4 style="color: #ffa500; margin-bottom: 10px;">💬 실시간 채팅</h4>
            <button id="openChatBtn" onclick="openChat()" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
                채팅창 열기
            </button>
            <p style="font-size: 12px; color: #aaa; margin-top: 5px;">
                새 창에서 실시간 채팅에 참여하세요
            </p>
        </div>
    </div>

    <div class="status" id="status">
        상태: 연결 대기중...
    </div>
</div>

<script>
    class WebRTCLive {
        constructor() {
            this.ws = null;
            this.pc = null;
            this.localStream = null;
            this.remoteStream = null;
            this.isBroadcaster = false;
            this.roomId = null;
            this.userId = null;
            this.viewers = new Set();

            this.init();
        }

        init() {
            // 랜덤 사용자 ID 생성
            document.getElementById('userId').value = 'user_' + Math.random().toString(36).substr(2, 9);

            // 이벤트 리스너 등록
            document.getElementById('broadcasterBtn').addEventListener('click', () => this.selectRole(true));
            document.getElementById('viewerBtn').addEventListener('click', () => this.selectRole(false));
            document.getElementById('connectBtn').addEventListener('click', () => this.connect());
            document.getElementById('disconnectBtn').addEventListener('click', () => this.disconnect());
            document.getElementById('toggleVideo').addEventListener('click', () => this.toggleVideo());
            document.getElementById('toggleAudio').addEventListener('click', () => this.toggleAudio());
        }

        selectRole(broadcaster) {
            this.isBroadcaster = broadcaster;

            // UI 업데이트
            document.getElementById('broadcasterBtn').classList.toggle('active', broadcaster);
            document.getElementById('viewerBtn').classList.toggle('active', !broadcaster);

            const localSection = document.querySelector('.video-section:first-child h3');
            const localControls = document.querySelector('.video-section:first-child div[style*="margin-top"]');
            
            if (broadcaster) {
                localSection.textContent = '📹 내 방송';
                localControls.style.display = 'block';
            } else {
                localSection.textContent = '📹 내 화면 (비활성)';
                localControls.style.display = 'none';
            }

            this.updateStatus(`역할 선택: ${broadcaster ? '방송자' : '시청자'}`);
        }

        async connect() {
            try {
                this.roomId = document.getElementById('roomId').value.trim();
                this.userId = document.getElementById('userId').value.trim();

                if (!this.roomId || !this.userId) {
                    alert('방 ID와 사용자 ID를 입력해주세요.');
                    return;
                }

                if (this.isBroadcaster === null) {
                    alert('방송자 또는 시청자 역할을 선택해주세요.');
                    return;
                }

                this.updateStatus('연결 중...');

                // WebSocket 연결
                await this.connectWebSocket();

                // 미디어 스트림 초기화 (방송자만)
                if (this.isBroadcaster) {
                    await this.initializeLocalStream();
                }

                // WebRTC 연결 초기화
                this.initializePeerConnection();

                // 방 입장
                this.joinRoom();

                // UI 상태 업데이트
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('broadcasterBtn').disabled = true;
                document.getElementById('viewerBtn').disabled = true;

            } catch (error) {
                console.error('연결 실패:', error);
                this.updateStatus('연결 실패: ' + error.message);
            }
        }

        async connectWebSocket() {
            return new Promise((resolve, reject) => {
                // WebSocket 서버 주소
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host;
                const wsUrl = `${protocol}//${host}/signaling`;
                
                this.ws = new WebSocket(wsUrl);

                this.ws.onopen = () => {
                    this.updateStatus('WebSocket 연결됨');
                    resolve();
                };

                this.ws.onmessage = (event) => {
                    this.handleSignalingMessage(JSON.parse(event.data));
                };

                this.ws.onclose = () => {
                    this.updateStatus('WebSocket 연결 끊어짐');
                };

                this.ws.onerror = (error) => {
                    console.error('WebSocket 오류:', error);
                    reject(error);
                };
            });
        }

        async initializeLocalStream() {
            const quality = document.getElementById('videoQuality').value;

            const constraints = {
                video: this.getVideoConstraints(quality),
                audio: true
            };

            try {
                this.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = this.localStream;
                this.updateStatus('카메라/마이크 활성화됨');
            } catch (error) {
                console.error('미디어 접근 실패:', error);
                throw new Error('카메라/마이크 접근 권한이 필요합니다.');
            }
        }

        getVideoConstraints(quality) {
            const constraints = {
                '720p': { width: 1280, height: 720, frameRate: 30 },
                '480p': { width: 854, height: 480, frameRate: 30 },
                '360p': { width: 640, height: 360, frameRate: 30 }
            };
            return constraints[quality] || constraints['720p'];
        }

        initializePeerConnection() {
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    // TURN 서버 추가 가능 (실제 운영시 필요)
                ]
            };

            this.pc = new RTCPeerConnection(config);

            // ICE 후보 처리
            this.pc.onicecandidate = (event) => {
                if (event.candidate) {
                    this.sendSignalingMessage('ice-candidate', {
                        candidate: event.candidate
                    });
                }
            };

            // 원격 스트림 처리
            this.pc.ontrack = (event) => {
                console.log('원격 스트림 수신:', event.streams[0]);
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                this.updateStatus('방송 수신 중...');
            };

            this.pc.onconnectionstatechange = () => {
                this.updateStatus(`연결 상태: ${this.pc.connectionState}`);
            };

            // 로컬 스트림을 피어 연결에 추가 (방송자만)
            if (this.localStream && this.isBroadcaster) {
                this.localStream.getTracks().forEach(track => {
                    this.pc.addTrack(track, this.localStream);
                });
            }
        }

        joinRoom() {
            this.sendSignalingMessage('join-room', {
                isBroadcaster: this.isBroadcaster
            });
        }

        async handleSignalingMessage(message) {
            console.log('시그널링 메시지 수신:', message);

            try {
                switch (message.type) {
                    case 'room-joined':
                        this.updateStatus(`방 "${this.roomId}" 입장 완료`);
                        this.updateViewersList(message.data.viewers);
                        break;

                    case 'user-joined':
                        this.updateStatus(`${message.data.userId}님이 입장했습니다.`);
                        this.viewers.add(message.data.userId);
                        this.updateViewersList(Array.from(this.viewers));

                        // 방송자인 경우 offer 생성
                        if (this.isBroadcaster) {
                            await this.createOffer();
                        }
                        break;

                    case 'user-left':
                        this.updateStatus(`${message.data.userId}님이 나갔습니다.`);
                        this.viewers.delete(message.data.userId);
                        this.updateViewersList(Array.from(this.viewers));
                        break;

                    case 'offer':
                        await this.handleOffer(message.data.offer);
                        break;

                    case 'answer':
                        await this.handleAnswer(message.data.answer);
                        break;

                    case 'ice-candidate':
                        await this.handleIceCandidate(message.data.candidate);
                        break;

                    case 'error':
                        this.updateStatus('오류: ' + message.data.message);
                        break;
                }
            } catch (error) {
                console.error('시그널링 메시지 처리 오류:', error);
            }
        }

        async createOffer() {
            if (!this.pc) return;

            try {
                const offer = await this.pc.createOffer();
                await this.pc.setLocalDescription(offer);

                this.sendSignalingMessage('offer', {
                    offer: offer
                });

                this.updateStatus('Offer 전송됨');
            } catch (error) {
                console.error('Offer 생성 실패:', error);
            }
        }

        async handleOffer(offer) {
            if (!this.pc) return;

            try {
                await this.pc.setRemoteDescription(offer);

                // 시청자인 경우에만 answer 생성
                if (!this.isBroadcaster) {
                    const answer = await this.pc.createAnswer();
                    await this.pc.setLocalDescription(answer);

                    this.sendSignalingMessage('answer', {
                        answer: answer
                    });

                    this.updateStatus('Answer 전송됨');
                }
            } catch (error) {
                console.error('Offer 처리 실패:', error);
            }
        }

        async handleAnswer(answer) {
            if (!this.pc) return;

            try {
                await this.pc.setRemoteDescription(answer);
                this.updateStatus('Answer 수신됨 - 연결 완료');
            } catch (error) {
                console.error('Answer 처리 실패:', error);
            }
        }

        async handleIceCandidate(candidate) {
            if (!this.pc) return;

            try {
                await this.pc.addIceCandidate(candidate);
            } catch (error) {
                console.error('ICE 후보 추가 실패:', error);
            }
        }

        sendSignalingMessage(type, data = {}) {
            if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                const message = {
                    type: type,
                    roomId: this.roomId,
                    userId: this.userId,
                    data: data
                };
                
                // join-room 메시지의 경우 isBroadcaster를 최상위 레벨에 추가
                if (type === 'join-room') {
                    message.isBroadcaster = data.isBroadcaster || this.isBroadcaster;
                }
                
                this.ws.send(JSON.stringify(message));
            }
        }

        toggleVideo() {
            if (this.localStream) {
                const videoTrack = this.localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    document.getElementById('toggleVideo').textContent =
                        videoTrack.enabled ? '카메라 끄기' : '카메라 켜기';
                }
            }
        }

        toggleAudio() {
            if (this.localStream) {
                const audioTrack = this.localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('toggleAudio').textContent =
                        audioTrack.enabled ? '마이크 끄기' : '마이크 켜기';
                }
            }
        }

        updateViewersList(viewers) {
            const viewersListEl = document.getElementById('viewersList');
            if (viewers && viewers.length > 0) {
                viewersListEl.innerHTML = viewers.map(viewer =>
                    `<div class="viewer-item">👤 ${viewer}</div>`
                ).join('');
            } else {
                viewersListEl.innerHTML = '연결된 시청자가 없습니다.';
            }
        }

        updateStatus(message) {
            const now = new Date().toLocaleTimeString();
            document.getElementById('status').textContent = `[${now}] ${message}`;
            console.log(message);
        }

        openChat() {
            // 채팅창을 새 창으로 열기
            const liveNo = this.roomId ? this.roomId.replace('room', '') : '123'; // room123 -> 123
            const memNo = prompt('회원 번호를 입력하세요:', '1');
            
            if (memNo) {
                const chatUrl = `/live-chat.html?liveNo=${liveNo}&memNo=${memNo}`;
                window.open(chatUrl, 'livechat', 'width=450,height=700,scrollbars=yes,resizable=yes');
            }
        }

        disconnect() {
            // 스트림 정리
            if (this.localStream) {
                this.localStream.getTracks().forEach(track => track.stop());
                this.localStream = null;
            }

            // 피어 연결 정리
            if (this.pc) {
                this.pc.close();
                this.pc = null;
            }

            // WebSocket 정리
            if (this.ws) {
                this.ws.close();
                this.ws = null;
            }

            // UI 초기화
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('toggleVideo').textContent = '카메라 끄기';
            document.getElementById('toggleAudio').textContent = '마이크 끄기';

            // 역할 선택 활성화
            document.getElementById('broadcasterBtn').disabled = false;
            document.getElementById('viewerBtn').disabled = false;

            this.updateStatus('연결 해제됨');
            this.updateViewersList([]);
        }
    }

    // 앱 초기화
    const webrtcLive = new WebRTCLive();
    
    // 전역 함수로 openChat 등록
    window.openChat = function() {
        webrtcLive.openChat();
    };

    // 페이지 언로드시 정리
    window.addEventListener('beforeunload', () => {
        webrtcLive.disconnect();
    });
</script>
</body>
</html>
