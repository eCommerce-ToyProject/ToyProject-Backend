<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라이브 채팅</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 400px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff4757;
            border-radius: 50%;
            animation: pulse 2s infinite;
            margin-right: 8px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .user-count {
            font-size: 12px;
            opacity: 0.9;
        }

        .connection-status {
            position: absolute;
            top: 10px;
            right: 15px;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-connected {
            background: #2ed573;
            color: white;
        }

        .status-disconnected {
            background: #ff4757;
            color: white;
        }

        .status-connecting {
            background: #ffa502;
            color: white;
        }

        .login-form {
            padding: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-system {
            text-align: center;
            color: #6c757d;
            font-size: 12px;
            font-style: italic;
        }

        .message-user {
            background: white;
            padding: 12px 15px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-my {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: 50px;
        }

        .message-header {
            font-size: 11px;
            color: #6c757d;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .message-my .message-header {
            color: rgba(255, 255, 255, 0.8);
        }

        .message-content {
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #ff4757;
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 20px;
            font-size: 12px;
            text-align: center;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 스크롤바 스타일링 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* 반응형 디자인 */
        @media (max-width: 480px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 채팅 헤더 -->
        <div class="chat-header">
            <div class="connection-status" id="connectionStatus">연결 중...</div>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>LIVE</span>
            </div>
            <div class="chat-title" id="chatTitle">라이브 채팅</div>
            <div class="user-count" id="userCount">접속자: 0명</div>
        </div>

        <!-- 로그인 폼 -->
        <div class="login-form" id="loginForm">
            <div class="form-group">
                <label for="liveNo">라이브 방송 번호</label>
                <input type="number" id="liveNo" placeholder="방송 번호를 입력하세요" min="1">
            </div>
            <div class="form-group">
                <label for="memNo">회원 번호</label>
                <input type="number" id="memNo" placeholder="회원 번호를 입력하세요" min="1">
            </div>
            <button class="btn btn-primary" onclick="joinChat()">채팅 참여</button>
        </div>

        <!-- 채팅 영역 -->
        <div class="chat-messages" id="chatMessages" style="display: none;"></div>

        <!-- 채팅 입력 -->
        <div class="chat-input" id="chatInput" style="display: none;">
            <div class="input-group">
                <input type="text" class="message-input" id="messageInput" 
                       placeholder="메시지를 입력하세요..." maxlength="500">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let currentLiveNo = null;
        let currentMemNo = null;
        let isConnected = false;

        // URL 파라미터에서 값 가져오기
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const liveNoParam = urlParams.get('liveNo');
            const memNoParam = urlParams.get('memNo');
            
            if (liveNoParam) {
                document.getElementById('liveNo').value = liveNoParam;
            }
            if (memNoParam) {
                document.getElementById('memNo').value = memNoParam;
            }

            // Enter 키 이벤트 리스너
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // 로그인 폼 Enter 키 이벤트
            document.getElementById('liveNo').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('memNo').focus();
                }
            });

            document.getElementById('memNo').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    joinChat();
                }
            });
        };

        function updateConnectionStatus(status, message) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.className = `connection-status status-${status}`;
            statusElement.textContent = message;
        }

        function joinChat() {
            const liveNo = document.getElementById('liveNo').value;
            const memNo = document.getElementById('memNo').value;

            if (!liveNo || !memNo) {
                showError('라이브 방송 번호와 회원 번호를 모두 입력해주세요.');
                return;
            }

            currentLiveNo = parseInt(liveNo);
            currentMemNo = parseInt(memNo);

            // 로딩 표시
            showLoading();
            updateConnectionStatus('connecting', '연결 중...');

            // WebSocket 연결
            connectWebSocket();
        }

        function connectWebSocket() {
            try {
                const socket = new SockJS('/ws');
                stompClient = Stomp.over(socket);

                // 디버그 비활성화
                stompClient.debug = null;

                stompClient.connect({}, function(frame) {
                    console.log('Connected: ' + frame);
                    isConnected = true;
                    updateConnectionStatus('connected', '연결됨');

                    // 채팅 메시지 구독
                    stompClient.subscribe(`/topic/live/${currentLiveNo}`, function(message) {
                        const chatMessage = JSON.parse(message.body);
                        displayMessage(chatMessage);
                    });

                    // 접속자 수 구독
                    stompClient.subscribe(`/topic/live/${currentLiveNo}/usercount`, function(message) {
                        const userCount = parseInt(message.body);
                        updateUserCount(userCount);
                    });

                    // 에러 메시지 구독
                    stompClient.subscribe('/user/queue/errors', function(error) {
                        console.error('WebSocket Error:', error.body);
                        showError(error.body);
                    });

                    // 채팅방 입장
                    stompClient.send(`/app/chat.join/${currentLiveNo}`, {}, JSON.stringify({
                        liveNo: currentLiveNo,
                        memNo: currentMemNo
                    }));

                    // UI 전환
                    showChatInterface();
                    loadChatHistory();

                }, function(error) {
                    console.error('Connection error:', error);
                    updateConnectionStatus('disconnected', '연결 실패');
                    showError('WebSocket 연결에 실패했습니다: ' + error);
                    hideLoading();
                });

            } catch (error) {
                console.error('WebSocket initialization error:', error);
                updateConnectionStatus('disconnected', '연결 실패');
                showError('WebSocket 초기화에 실패했습니다.');
                hideLoading();
            }
        }

        function disconnect() {
            if (stompClient !== null && isConnected) {
                // 채팅방 퇴장
                stompClient.send(`/app/chat.leave/${currentLiveNo}`, {}, JSON.stringify({
                    liveNo: currentLiveNo,
                    memNo: currentMemNo
                }));

                stompClient.disconnect();
                isConnected = false;
                updateConnectionStatus('disconnected', '연결 끊김');
            }

            // UI 초기화
            showLoginForm();
            clearMessages();
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message) {
                return;
            }

            if (!stompClient || !isConnected) {
                showError('채팅 서버에 연결되지 않았습니다.');
                return;
            }

            try {
                stompClient.send(`/app/chat.sendMessage/${currentLiveNo}`, {}, JSON.stringify({
                    liveNo: currentLiveNo,
                    memNo: currentMemNo,
                    message: message,
                    type: 'CHAT'
                }));

                messageInput.value = '';
                messageInput.focus();

            } catch (error) {
                console.error('Message send error:', error);
                showError('메시지 전송에 실패했습니다.');
            }
        }

        function displayMessage(chatMessage) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.className = 'message';

            const isMyMessage = chatMessage.memNo === currentMemNo;
            const isSystemMessage = chatMessage.type === 'JOIN' || chatMessage.type === 'LEAVE';

            if (isSystemMessage) {
                messageElement.className += ' message-system';
                messageElement.innerHTML = `
                    <div>${chatMessage.message}</div>
                `;
            } else {
                messageElement.className += isMyMessage ? ' message-user message-my' : ' message-user';
                messageElement.innerHTML = `
                    <div class="message-header">${chatMessage.memName} (${chatMessage.memNo})</div>
                    <div class="message-content">${escapeHtml(chatMessage.message)}</div>
                    <div class="message-time">${formatTime(chatMessage.sendTime)}</div>
                `;
            }

            messagesContainer.appendChild(messageElement);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function loadChatHistory() {
            // 채팅 기록 로드
            fetch(`/api/chat/history/${currentLiveNo}?page=0&size=50`)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('채팅 기록을 불러올 수 없습니다.');
                })
                .then(data => {
                    const messages = data.content || [];
                    messages.reverse().forEach(message => {
                        displayMessage(message);
                    });
                })
                .catch(error => {
                    console.warn('Chat history load error:', error);
                    // 기록 로드 실패는 치명적이지 않으므로 경고만 표시
                });
        }

        function updateUserCount(count) {
            document.getElementById('userCount').textContent = `접속자: ${count}명`;
        }

        function showChatInterface() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('chatMessages').style.display = 'block';
            document.getElementById('chatInput').style.display = 'block';
            document.getElementById('chatTitle').textContent = `라이브 방송 #${currentLiveNo}`;
            document.getElementById('messageInput').focus();
            hideLoading();
        }

        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('chatMessages').style.display = 'none';
            document.getElementById('chatInput').style.display = 'none';
            document.getElementById('chatTitle').textContent = '라이브 채팅';
            hideLoading();
        }

        function showLoading() {
            const loginForm = document.getElementById('loginForm');
            loginForm.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                </div>
                <p style="text-align: center; color: #6c757d; margin-top: 15px;">연결 중...</p>
                <button class="btn btn-danger" onclick="cancelConnection()" style="margin-top: 15px;">취소</button>
            `;
        }

        function hideLoading() {
            if (document.getElementById('loginForm').style.display !== 'none') {
                // 로그인 폼 복원
                document.getElementById('loginForm').innerHTML = `
                    <div class="form-group">
                        <label for="liveNo">라이브 방송 번호</label>
                        <input type="number" id="liveNo" placeholder="방송 번호를 입력하세요" min="1">
                    </div>
                    <div class="form-group">
                        <label for="memNo">회원 번호</label>
                        <input type="number" id="memNo" placeholder="회원 번호를 입력하세요" min="1">
                    </div>
                    <button class="btn btn-primary" onclick="joinChat()">채팅 참여</button>
                `;
            }
        }

        function cancelConnection() {
            if (stompClient) {
                stompClient.disconnect();
            }
            hideLoading();
            updateConnectionStatus('disconnected', '연결 취소됨');
        }

        function clearMessages() {
            document.getElementById('chatMessages').innerHTML = '';
        }

        function showError(message) {
            // 기존 에러 메시지 제거
            const existingError = document.querySelector('.error-message');
            if (existingError) {
                existingError.remove();
            }

            const errorElement = document.createElement('div');
            errorElement.className = 'error-message';
            errorElement.textContent = message;

            const container = document.querySelector('.chat-container');
            container.insertBefore(errorElement, container.firstChild.nextSibling);

            // 5초 후 자동 제거
            setTimeout(() => {
                if (errorElement.parentNode) {
                    errorElement.remove();
                }
            }, 5000);
        }

        function formatTime(timeString) {
            if (!timeString) return '';
            
            try {
                const date = new Date(timeString);
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes}`;
            } catch (error) {
                return '';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 페이지 언로드 시 연결 해제
        window.addEventListener('beforeunload', function() {
            if (stompClient && isConnected) {
                disconnect();
            }
        });

        // 연결 상태 모니터링
        setInterval(function() {
            if (stompClient && stompClient.connected) {
                if (!isConnected) {
                    isConnected = true;
                    updateConnectionStatus('connected', '연결됨');
                }
            } else if (isConnected) {
                isConnected = false;
                updateConnectionStatus('disconnected', '연결 끊김');
            }
        }, 3000);
    </script>
</body>
</html>
